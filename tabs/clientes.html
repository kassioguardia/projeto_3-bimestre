<div id="tab-clientes" class="tab-content d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0 fw-bold">Lista de Clientes</h5>
        <button data-action="new" data-entity="cliente" class="btn btn-primary">
            <i class="fa-solid fa-plus me-2"></i>Novo Cliente
        </button>
    </div>
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Email</th>
                        <th scope="col">Telefone</th>
                        <th scope="col">Endereço</th>
                        <th scope="col">Data Cadastro</th>
                        <th scope="col" class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-clientes-body"></tbody>
            </table>
        </div>
    </div>
</div>
